name: CI run on PR
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  WALGVERSION: v3.0.8b
  WALGURL: https://github.com/pgvillage-tools/wal-g.git
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  build-rpms:
    name: build for ${{ matrix.distro }} on ${{ matrix.arch }}
    runs-on: ubuntu-latest
    env:
      BASEIMAGE: ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - amd64
        distro:
          #- rockylinux:8
          - rockylinux:9
          - fedora:39
          #- fedora:40
          #- fedora:41
          #- fedora:42
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: git module stuff
        run: |
          git clone ${{ env.WALGURL }} wal-g
          cd wal-g
          git checkout ${{ env.WALGVERSION }}
          git show --stat | head -n3
      - name: update to docker-compose v2
        run: |
          sudo apt-get install -y curl
          sudo curl -SL https://github.com/docker/compose/releases/download/v2.3.3/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
      - name: compose
        run: |
          docker-compose up builder
          find rpms
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
          DOCKER_BUILDKIT: 1

  versions:
    name: list supported debian and ubuntu versions
    runs-on: ubuntu-latest
    outputs:
      baseimage_version: ${{ steps.versions.outputs.baseimage_version }}
    steps:
      - name: list released and supported versions of debian and ubuntu
        id: versions
        run: |
          TODAY=$(date +%F)
          BASEIMAGE_VERSION=$(for DISTRO in debian ubuntu; do
            curl -fsSL "https://endoflife.date/api/${DISTRO}.json" |
              jq -c --arg distro "${DISTRO}" --arg today "${TODAY}" \
                '.[] | select(.releaseDate <= $today and (.eol == false or ((.eol | type) == "string" and .eol > $today))) | "\($distro):\(.cycle)"'
          done | jq -sc .)
          echo "Building for ${BASEIMAGE_VERSION}"
          [ "${BASEIMAGE_VERSION}" != "[]" ]
          echo "baseimage_version=${BASEIMAGE_VERSION}" >> "$GITHUB_OUTPUT"

  build-debs:
    name: build for ${{ matrix.distro }} on ${{ matrix.arch }}
    needs:
      - versions
    runs-on: ubuntu-latest
    env:
      DEB_BASEIMAGE: ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - amd64
        # same distros as the apt repository in pgvillage-build/aptbuilder
        distro: ${{ fromJSON(needs.versions.outputs.baseimage_version) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: git module stuff
        run: |
          git clone ${{ env.WALGURL }} wal-g
          cd wal-g
          git checkout ${{ env.WALGVERSION }}
          git show --stat | head -n3
      - name: update to docker-compose v2
        run: |
          sudo apt-get install -y curl
          sudo curl -SL https://github.com/docker/compose/releases/download/v2.3.3/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
      - name: compose
        run: |
          docker-compose up --exit-code-from deb-builder deb-builder
          find debs
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
          DOCKER_BUILDKIT: 1

  test_image_building:
    name: Test image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: git module stuff
        run: |
          git clone $WALGURL wal-g
          cd wal-g
          git checkout $WALGVERSION
          git show --stat | head -n3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            name=ghcr.io/${{ github.repository }},enable=true
          tags: |
            type=semver,pattern={{raw}}
            type=raw,value=latest
            type=sha

      - name: Build and push operator image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/wal-g-pg/Dockerfile
          push: false
          platforms: 'linux/amd64'
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}

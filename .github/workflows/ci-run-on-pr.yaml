name: CI run on PR
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  WALGVERSION: v3.0.8b
  WALGURL: https://github.com/pgvillage-tools/wal-g.git
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  versions:
    name: list supported distro versions
    runs-on: ubuntu-latest
    outputs:
      rpm_distros: ${{ steps.versions.outputs.rpm_distros }}
      deb_distros: ${{ steps.versions.outputs.deb_distros }}
    steps:
      - name: list released and supported versions of all distros
        id: versions
        run: |
          TODAY=$(date +%F)
          # usage: supported <endoflife.date product> <image> <name>
          # prints {image, name} for every released and not yet eol cycle
          supported() {
            curl -fsSL "https://endoflife.date/api/${1}.json" |
              jq -c --arg image "${2}" --arg name "${3}" --arg today "${TODAY}" \
                '.[] | select(.releaseDate <= $today and (.eol == false or ((.eol | type) == "string" and .eol > $today))) | {image: "\($image):\(.cycle)", name: "\($name)-\(.cycle)"}'
          }
          RPM_DISTROS=$({
            supported rocky-linux rockylinux/rockylinux el
            supported opensuse opensuse/leap opensuse-leap
            supported fedora fedora fedora
          } | jq -sc .)
          DEB_DISTROS=$({
            supported debian debian debian
            supported ubuntu ubuntu ubuntu
          } | jq -sc .)
          echo "Building rpms for ${RPM_DISTROS}"
          echo "Building debs for ${DEB_DISTROS}"
          [ "${RPM_DISTROS}" != "[]" ] && [ "${DEB_DISTROS}" != "[]" ]
          echo "rpm_distros=${RPM_DISTROS}" >> "$GITHUB_OUTPUT"
          echo "deb_distros=${DEB_DISTROS}" >> "$GITHUB_OUTPUT"

  build-rpms:
    name: build for ${{ matrix.distro.name }} on ${{ matrix.arch }}
    needs:
      - versions
    runs-on: ubuntu-latest
    env:
      BASEIMAGE: ${{ matrix.distro.image }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - amd64
        # el (rocky), opensuse leap and fedora
        distro: ${{ fromJSON(needs.versions.outputs.rpm_distros) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: git module stuff
        run: |
          git clone $WALGURL wal-g
          cd wal-g
          git checkout $WALGVERSION
          git show --stat | head -n3
      - name: update to docker-compose v2
        run: |
          sudo apt-get install -y curl
          sudo curl -SL https://github.com/docker/compose/releases/download/v2.3.3/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
      - name: compose
        run: |
          docker-compose up --exit-code-from builder builder
          find rpms
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
          DOCKER_BUILDKIT: 1

  build-debs:
    name: build for ${{ matrix.distro.name }} on ${{ matrix.arch }}
    needs:
      - versions
    runs-on: ubuntu-latest
    env:
      DEB_BASEIMAGE: ${{ matrix.distro.image }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - amd64
        # same distros as the apt repository in pgvillage-build/aptbuilder
        distro: ${{ fromJSON(needs.versions.outputs.deb_distros) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: git module stuff
        run: |
          git clone $WALGURL wal-g
          cd wal-g
          git checkout $WALGVERSION
          git show --stat | head -n3
      - name: update to docker-compose v2
        run: |
          sudo apt-get install -y curl
          sudo curl -SL https://github.com/docker/compose/releases/download/v2.3.3/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
      - name: compose
        run: |
          docker-compose up --exit-code-from deb-builder deb-builder
          find debs
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
          DOCKER_BUILDKIT: 1

  test_image_building:
    name: Test image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: git module stuff
        run: |
          git clone $WALGURL wal-g
          cd wal-g
          git checkout $WALGVERSION
          git show --stat | head -n3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            name=ghcr.io/${{ github.repository }},enable=true
          tags: |
            type=semver,pattern={{raw}}
            type=raw,value=latest
            type=sha

      - name: Build and push operator image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/wal-g-pg/Dockerfile
          push: false
          platforms: 'linux/amd64'
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
